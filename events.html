<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Информация о мероприятии Федерации Street Workout.">

    <title>Мероприятие | Федерация Street Workout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-mark">SW</div>
        <div class="logo-text">
            <strong>STREET WORKOUT</strong>
            <span>FEDERATION</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Главная</a>
        <a href="index.html#about">О федерации</a>
        <a href="index.html#news">Новости</a>
        <a href="index.html#events">Мероприятия</a>
        <a href="index.html#contacts">Контакты</a>
    </nav>
</header>

<main>
    <article class="single-news">
        <!-- Статус мероприятия (например: ПРЕДСТОЯЩЕЕ) -->
        <div class="news-date" id="event-status">
            ПРЕДСТОЯЩЕЕ
        </div>

        <!-- Название мероприятия -->
        <h1 id="event-title">
            Загрузка мероприятия...
        </h1>

        <!-- Полное описание -->
        <div class="news-content" id="event-content-box">
            <p>Пожалуйста, подождите, идет загрузка информации...</p>
        </div>

        <a class="back-button" href="index.html#events">
            ← Вернуться к мероприятиям
        </a>
    </article>
</main>

<footer>
    <div class="footer-bottom">
        <p>© 2026 Федерация Street Workout</p>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
