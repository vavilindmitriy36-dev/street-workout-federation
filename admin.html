<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления тренера | Street Workout</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK 8.x -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="background: var(--black); color: #fff;">

    <!-- ЭКРАН АВТОРИЗАЦИИ (ЗАЩИЩЕННЫЙ ВХОД ЧЕРЕЗ FIREBASE AUTH) -->
    <div id="authScreen" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 20px;">
        <div class="modal-content" style="display: block; max-width: 400px; width: 100%;">
            <h3 style="margin-bottom: 20px; color: var(--orange);">Вход для тренера</h3>
            <div class="form-group"><input type="email" id="adminEmail" placeholder="Email тренера"></div>
            <div class="form-group"><input type="password" id="adminPassword" placeholder="Пароль"></div>
            <div class="error-msg" id="loginError" style="color: var(--red); margin-bottom: 10px; font-size: 13px;"></div>
            <button class="btn btn-primary full-width" id="adminLoginBtn">Войти в панель</button>
            <div style="margin-top: 15px; text-align: center;">
                <a href="index.html" style="color: var(--gray); font-size: 13px;">← На главную сайт</a>
            </div>
        </div>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ (СКРЫТА, ДОСТУПНА ТОЛЬКО ПОСЛЕ АВТОРИЗАЦИИ) -->
    <div id="dashboardScreen" style="display: none; padding: 40px 5%; max-width: 900px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--orange); padding-bottom: 15px;">
            <h2>Управление сайтом</h2>
            <button id="logoutBtn" class="btn btn-secondary" style="padding: 6px 15px; font-size: 12px;">Выйти</button>
        </div>

        <!-- 1. РЕДАКТИРОВАНИЕ КОНТАКТОВ И "О НАС" -->
        <div class="contact-form-container" style="margin-bottom: 30px;">
            <h3 style="color: var(--orange); margin-bottom: 15px;">Основные данные (О нас, Контакты)</h3>
            <div class="form-group"><label>Заголовок "О нас":</label><input type="text" id="editAboutTitle"></div>
            <div class="form-group"><label>Текст параграфа 1:</label><textarea id="editAboutP1" rows="3"></textarea></div>
            <div class="form-group"><label>Текст параграфа 2:</label><textarea id="editAboutP2" rows="3"></textarea></div>
            <div class="form-group"><label>Адрес:</label><input type="text" id="editAddress"></div>
            <div class="form-group"><label>Телефон:</label><input type="text" id="editPhone"></div>
            <div class="form-group"><label>Email:</label><input type="text" id="editEmail"></div>
            <button class="btn btn-primary" id="saveGeneralBtn" style="margin-top: 10px;">Сохранить изменения</button>
        </div>

        <!-- 2. ДОБАВЛЕНИЕ НОВОСТЕЙ -->
        <div class="contact-form-container" style="margin-bottom: 30px;">
            <h3 style="color: var(--orange); margin-bottom: 15px;">Добавить новость</h3>
            <div class="form-group"><input type="text" id="newsTitleInput" placeholder="Заголовок новости"></div>
            <div class="form-group"><textarea id="newsDescInput" rows="3" placeholder="Текст новости"></textarea></div>
            <div class="form-group"><input type="text" id="newsImgInput" placeholder="Ссылка на картинку (URL)"></div>
            <button class="btn btn-primary" id="saveNewsBtn">Опубликовать новость</button>
        </div>

        <!-- 3. ДОБАВЛЕНИЕ МЕРОПРИЯТИЙ -->
        <div class="contact-form-container" style="margin-bottom: 30px;">
            <h3 style="color: var(--orange); margin-bottom: 15px;">Добавить мероприятие</h3>
            <div class="form-group"><input type="text" id="eventTitleInput" placeholder="Название турнира"></div>
            <div class="form-group"><input type="text" id="eventDateInput" placeholder="Дата (например: 15 июля 2026)"></div>
            <div class="form-group"><textarea id="eventDescInput" rows="2" placeholder="Описание"></textarea></div>
            <button class="btn btn-primary" id="saveEventBtn">Добавить мероприятие</button>
        </div>
        
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" class="btn btn-secondary" target="_blank">Посмотреть сайт</a>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
