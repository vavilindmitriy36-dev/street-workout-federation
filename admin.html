<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Федерация Street Workout Казахстан</title>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Подключение Firebase SDK (Модули v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbIUmK6OS7Sd5jcDygCtxMgXi_Tznc56o",
            authDomain: "street-workout-federation.firebaseapp.com",
            projectId: "street-workout-federation",
            storageBucket: "street-workout-federation.firebasestorage.app",
            messagingSenderId: "281767473596",
            appId: "1:281767473596:web:71c290af7a5fac1472fbb9",
            measurementId: "G-ZEZBRRHKHJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            const authPanel = document.getElementById('auth-panel');
            const adminPanel = document.getElementById('admin-panel');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const addNewsForm = document.getElementById('add-news-form');
            const addEventForm = document.getElementById('add-event-form');
            const newsList = document.getElementById('news-list');
            const eventsList = document.getElementById('events-list');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    authPanel.style.display = 'none';
                    adminPanel.style.display = 'block';
                    loadNewsAdmin();
                    loadEventsAdmin();
                } else {
                    authPanel.style.display = 'block';
                    adminPanel.style.display = 'none';
                }
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    alert('Ошибка входа: ' + error.message);
                }
            });

            logoutBtn.addEventListener('click', () => {
                signOut(auth);
            });

            // Добавление новости
            addNewsForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('news-title').value;
                const text = document.getElementById('news-text').value;
                const tag = document.getElementById('news-tag').value;
                const image = document.getElementById('news-image').value;

                try {
                    await addDoc(collection(db, "news"), {
                        title: title.trim(),
                        text: text.trim(),
                        tag: tag ? tag.trim() : 'НОВОСТИ',
                        image: image ? image.trim() : '',
                        createdAt: serverTimestamp()
                    });
                    addNewsForm.reset();
                    alert('Новость успешно добавлена!');
                    loadNewsAdmin();
                } catch (error) {
                    alert('Ошибка при публикации новости: ' + error.message);
                }
            });

            // Добавление мероприятия
            addEventForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('event-title').value;
                const text = document.getElementById('event-text').value;
                const status = document.getElementById('event-status').value;
                const image = document.getElementById('event-image').value;

                try {
                    await addDoc(collection(db, "events"), {
                        title: title.trim(),
                        text: text.trim(),
                        status: status ? status.trim() : 'ПРЕДСТОЯЩЕЕ',
                        image: image ? image.trim() : '',
                        createdAt: serverTimestamp()
                    });
                    addEventForm.reset();
                    alert('Мероприятие успешно добавлено!');
                    loadEventsAdmin();
                } catch (error) {
                    alert('Ошибка при публикации мероприятия: ' + error.message);
                }
            });

            // Загрузка списка новостей для админки
            async function loadNewsAdmin() {
                newsList.innerHTML = '<p style="color: #888;">Загрузка...</p>';
                try {
                    const q = query(collection(db, "news"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    newsList.innerHTML = '';
                    if (querySnapshot.empty) {
                        newsList.innerHTML = '<p style="color: #888;">Нет добавленных новостей.</p>';
                        return;
                    }

                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        const li = document.createElement('li');
                        li.className = 'news-item';
                        li.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222;";
                        
                        li.innerHTML = `
                            <div>
                                <strong style="color: var(--orange);">${escapeHtml(data.title)}</strong>
                                <p style="font-size: 13px; color: #aaa; margin-top: 4px;">Тег: ${escapeHtml(data.tag || 'НОВОСТИ')}</p>
                            </div>
                        `;
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.textContent = 'Удалить';
                        deleteBtn.style.cssText = "background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;";
                        
                        deleteBtn.addEventListener('click', async () => {
                            if (confirm("Удалить эту новость?")) {
                                try {
                                    await deleteDoc(doc(db, "news", document.id));
                                    loadNewsAdmin();
                                } catch (error) {
                                    alert('Ошибка при удалении: ' + error.message);
                                }
                            }
                        });

                        li.appendChild(deleteBtn);
                        newsList.appendChild(li);
                    });
                } catch (error) {
                    console.error("Ошибка загрузки новостей: ", error);
                }
            }

            // Загрузка списка мероприятий для админки
            async function loadEventsAdmin() {
                eventsList.innerHTML = '<p style="color: #888;">Загрузка...</p>';
                try {
                    const q = query(collection(db, "events"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    eventsList.innerHTML = '';
                    if (querySnapshot.empty) {
                        eventsList.innerHTML = '<p style="color: #888;">Нет добавленных мероприятий.</p>';
                        return;
                    }

                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        const li = document.createElement('li');
                        li.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222;";
                        
                        li.innerHTML = `
                            <div>
                                <strong style="color: var(--orange);">${escapeHtml(data.title)}</strong>
                                <p style="font-size: 13px; color: #aaa; margin-top: 4px;">Статус: ${escapeHtml(data.status || 'ПРЕДСТОЯЩЕЕ')}</p>
                            </div>
                        `;
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Удалить';
                        deleteBtn.style.cssText = "background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;";
                        
                        deleteBtn.addEventListener('click', async () => {
                            if (confirm("Удалить это мероприятие?")) {
                                try {
                                    await deleteDoc(doc(db, "events", document.id));
                                    loadEventsAdmin();
                                } catch (error) {
                                    alert('Ошибка при удалении: ' + error.message);
                                }
                            }
                        });

                        li.appendChild(deleteBtn);
                        eventsList.appendChild(li);
                    });
                } catch (error) {
                    console.error("Ошибка загрузки мероприятий: ", error);
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        });
    </script>
</head>
<body style="background: var(--black); color: var(--white);">

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-panel" class="container" style="max-width: 400px; margin: 100px auto; padding: 20px;">
        <div class="contact-form-container" style="background: var(--black-2); border: 2px solid var(--orange); padding: 30px; border-radius: 6px;">
            <h3 style="color: var(--orange); margin-bottom: 20px; text-transform: uppercase; text-align: center;">Вход в админ-панель</h3>
            <form id="login-form" class="question-form">
                <div class="form-group">
                    <label style="display:block; margin-bottom:5px; color:#aaa;">Email администратора</label>
                    <input type="email" id="email" required style="width:100%; padding:12px; background:#181818; border:1px solid #333; color:white; border-radius:4px;">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label style="display:block; margin-bottom:5px; color:#aaa;">Пароль</label>
                    <input type="password" id="password" required style="width:100%; padding:12px; background:#181818; border:1px solid #333; color:white; border-radius:4px;">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Войти в систему</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: var(--gray); font-size: 13px;">← На главную страницу сайта</a>
            </div>
        </div>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div id="admin-panel" style="display: none;">
        <!-- Шапка панели -->
        <header class="header" style="padding: 20px 7%; display: flex; justify-content: space-between; align-items: center; background: var(--black-2); border-bottom: 3px solid var(--orange);">
            <div class="logo">
                <!-- Заменено на картинку logo.png с сохранением фирменных стилей -->
                <img src="logo.png" alt="Logo" class="logo-img">
                <div class="logo-text" style="margin-left: 10px;">
                    <strong>SWF KAZAKHSTAN</strong>
                    <span>АДМИН-ПАНЕЛЬ</span>
                </div>
            </div>
            <div>
                <a href="index.html" class="btn btn-secondary" style="margin-right: 10px; padding: 8px 16px; font-size: 13px;">На сайт</a>
                <button id="logout-btn" class="delete-btn" style="background: var(--red); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">Выйти</button>
            </div>
        </header>

        <div class="container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
            
            <!-- БЛОК ДОБАВЛЕНИЯ НОВОСТИ -->
            <div class="contact-form-container" style="background: var(--black-2); border: 1px solid #333; padding: 30px; border-radius: 6px; margin-bottom: 30px;">
                <h3 style="color: var(--orange); margin-bottom: 20px; text-transform: uppercase;">Добавить новость (Баннер)</h3>
                <form id="add-news-form" class="question-form">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="news-title" placeholder="Заголовок новости" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <textarea id="news-text" rows="3" placeholder="Полный текст новости..." required></textarea>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="news-tag" placeholder="Тег (например: НОВОСТИ, СОРЕВНОВАНИЯ)" value="НОВОСТИ">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="news-image" placeholder="Ссылка на картинку (оставьте пустой для фирменной заглушки)">
                    </div>
                    <button type="submit" class="btn btn-primary">Опубликовать новость</button>
                </form>
            </div>

            <!-- БЛОК ДОБАВЛЕНИЯ МЕРОПРИЯТИЯ -->
            <div class="contact-form-container" style="background: var(--black-2); border: 1px solid #333; padding: 30px; border-radius: 6px; margin-bottom: 40px;">
                <h3 style="color: var(--orange); margin-bottom: 20px; text-transform: uppercase;">Добавить мероприятие / турнир</h3>
                <form id="add-event-form" class="question-form">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="event-title" placeholder="Название турнира / мероприятия" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <textarea id="event-text" rows="3" placeholder="Описание мероприятия..." required></textarea>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="event-status" placeholder="Статус (например: ПРЕДСТОЯЩЕЕ, СКОРО)" value="ПРЕДСТОЯЩЕЕ">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="text" id="event-image" placeholder="Ссылка на картинку (оставьте пустой для фирменной заглушки)">
                    </div>
                    <button type="submit" class="btn btn-primary">Опубликовать мероприятие</button>
                </form>
            </div>

            <!-- УПРАВЛЕНИЕ СУЩЕСТВУЮЩИМИ ЗАПИСЯМИ -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <div style="background: var(--black-2); padding: 25px; border-radius: 6px; border: 1px solid #333;">
                    <h3 style="color: var(--white); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--orange); padding-bottom: 8px;">Список новостей</h3>
                    <ul id="news-list" style="list-style: none; max-height: 350px; overflow-y: auto;">
                        <!-- Загружается динамически -->
                    </ul>
                </div>

                <div style="background: var(--black-2); padding: 25px; border-radius: 6px; border: 1px solid #333;">
                    <h3 style="color: var(--white); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--orange); padding-bottom: 8px;">Список мероприятий</h3>
                    <ul id="events-list" style="list-style: none; max-height: 350px; overflow-y: auto;">
                        <!-- Загружается динамически -->
                    </ul>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
