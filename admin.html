<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Федерация Street Workout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .card h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .auth-container {
            max-width: 400px;
            margin: 5rem auto;
        }

        #admin-panel {
            display: none;
        }

        .news-list {
            list-style: none;
        }

        .news-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .news-info p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <!-- Экран авторизации -->
    <div id="auth-panel" class="container auth-container">
        <div class="card">
            <h2>Вход в панель управления</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Войти</button>
            </form>
        </div>
    </div>

    <!-- Основная панель управления -->
    <div id="admin-panel">
        <header>
            <h1>Админ-панель Street Workout</h1>
            <button id="logout-btn" class="btn btn-danger">Выйти</button>
        </header>

        <div class="container">
            <!-- Добавление новости -->
            <div class="card">
                <h2>Добавить новость / событие</h2>
                <form id="add-news-form">
                    <div class="form-group">
                        <label for="title">Заголовок</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="content">Текст новости</label>
                        <textarea id="content" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn">Опубликовать</button>
                </form>
            </div>

            <!-- Список опубликованных новостей -->
            <div class="card">
                <h2>Управление новостями</h2>
                <ul id="news-list" class="news-list">
                    <!-- Загружаемые новости появятся здесь -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Подключение Firebase SDK (Модули v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbIUmK6OS7Sd5jcDygCtxMgXi_Tznc56o",
            authDomain: "street-workout-federation.firebaseapp.com",
            projectId: "street-workout-federation",
            storageBucket: "street-workout-federation.firebasestorage.app",
            messagingSenderId: "281767473596",
            appId: "1:281767473596:web:e4c39eb06ae0f05372fbb9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authPanel = document.getElementById('auth-panel');
        const adminPanel = document.getElementById('admin-panel');
        const loginForm = document.getElementById('login-form');
        const logoutBtn = document.getElementById('logout-btn');
        const addNewsForm = document.getElementById('add-news-form');
        const newsList = document.getElementById('news-list');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authPanel.style.display = 'none';
                adminPanel.style.display = 'block';
                loadNews();
            } else {
                authPanel.style.display = 'block';
                adminPanel.style.display = 'none';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Ошибка входа: ' + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        addNewsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            try {
                await addDoc(collection(db, "news"), {
                    title: title,
                    content: content,
                    createdAt: serverTimestamp()
                });
                addNewsForm.reset();
                loadNews();
            } catch (error) {
                alert('Ошибка при публикации новости: ' + error.message);
            }
        });

        async function loadNews() {
            newsList.innerHTML = '';
            try {
                const q = query(collection(db, "news"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const li = document.createElement('li');
                    li.className = 'news-item';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'news-info';
                    infoDiv.innerHTML = `<h3>${escapeHtml(data.title)}</h3><p>${escapeHtml(data.content)}</p>`;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn btn-danger';
                    deleteBtn.textContent = 'Удалить';
                    deleteBtn.addEventListener('click', async () => {
                        if (confirm("Вы уверены, что хотите удалить эту новость?")) {
                            try {
                                await deleteDoc(doc(db, "news", document.id));
                                loadNews();
                            } catch (error) {
                                alert('Ошибка при удалении: ' + error.message);
                            }
                        }
                    });

                    li.appendChild(infoDiv);
                    li.appendChild(deleteBtn);
                    newsList.appendChild(li);
                });
            } catch (error) {
                console.error("Ошибка при загрузке новостей: ", error);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
