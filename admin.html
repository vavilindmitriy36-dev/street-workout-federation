<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    #admin-panel { display: none; }
    .error { color: red; margin-top: 10px; }
    .status { color: green; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Форма входа -->
  <div id="login-form">
    <h2>Вход для администратора</h2>
    <div class="form-group">
      <label>Email:</label>
      <input type="email" id="email" placeholder="admin@example.com">
    </div>
    <div class="form-group">
      <label>Пароль:</label>
      <input type="password" id="password" placeholder="******">
    </div>
    <button id="btn-login">Войти</button>
    <div id="error-message" class="error"></div>
  </div>

  <!-- Панель управления -->
  <div id="admin-panel">
    <h2>Управление контентом</h2>
    <button id="btn-logout" style="background: #dc3545;">Выйти</button>
    <hr style="margin: 20px 0;">
    
    <h3>Опубликовать новость / пост</h3>
    <div class="form-group">
      <label>Заголовок:</label>
      <input type="text" id="news-title" placeholder="Введите заголовок">
    </div>
    <div class="form-group">
      <label>Текст новости:</label>
      <input type="text" id="news-text" placeholder="Введите текст">
    </div>
    <div class="form-group">
      <label>Фотография:</label>
      <input type="file" id="news-image" accept="image/*">
    </div>
    <button id="btn-save">Опубликовать</button>
    <div id="publish-status" class="status"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbIUmK6OS7Sd5jcDygCtxMgXi_Tznc56o",
      authDomain: "street-workout-federation.firebaseapp.com",
      projectId: "street-workout-federation",
      storageBucket: "street-workout-federation.firebasestorage.app",
      messagingSenderId: "281767473596",
      appId: "1:281767473596:web:e4c39eb06ae0f05372fbb9",
      measurementId: "G-DQJDKLMFR9"
    };

    const IMGBB_API_KEY = "bcf948cc297a6282995510514b88a047";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Проверка авторизации
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'none';
      }
    });

    // Авторизация
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errDiv = document.getElementById('error-message');
      errDiv.textContent = '';

      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          errDiv.textContent = 'Ошибка входа: ' + error.message;
        });
    });

    // Выход
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
    });

    // Публикация с автоматической загрузкой фото
    document.getElementById('btn-save').addEventListener('click', async () => {
      const title = document.getElementById('news-title').value;
      const text = document.getElementById('news-text').value;
      const imageFile = document.getElementById('news-image').files[0];
      const statusDiv = document.getElementById('publish-status');
      const saveBtn = document.getElementById('btn-save');

      if (!title || !text) {
        alert('Заполните заголовок и текст новости');
        return;
      }

      saveBtn.disabled = true;
      statusDiv.textContent = 'Публикация...';

      let imageUrl = '';

      try {
        // Загрузка картинки на ImgBB если файл выбран
        if (imageFile) {
          statusDiv.textContent = 'Загружаем изображение...';
          const formData = new FormData();
          formData.append('image', imageFile);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (result.success) {
            imageUrl = result.data.url;
          } else {
            throw new Error('Ошибка загрузки фото');
          }
        }

        // Сохранение записи в Firestore
        statusDiv.textContent = 'Сохраняем новость...';
        await addDoc(collection(db, "posts"), {
          title: title,
          text: text,
          imageUrl: imageUrl,
          createdAt: new Date()
        });

        statusDiv.textContent = 'Успешно опубликовано!';
        document.getElementById('news-title').value = '';
        document.getElementById('news-text').value = '';
        document.getElementById('news-image').value = '';
      } catch (e) {
        alert('Ошибка: ' + e.message);
        statusDiv.textContent = '';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
