<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Федерация Street Workout Казахстан</title>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Подключение Firebase SDK (Модули v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbIUmK6OS7Sd5jcDygCtxMgXi_Tznc56o",
            authDomain: "street-workout-federation.firebaseapp.com",
            projectId: "street-workout-federation",
            storageBucket: "street-workout-federation.firebasestorage.app",
            messagingSenderId: "281767473596",
            appId: "1:281767473596:web:71c290af7a5fac1472fbb9",
            measurementId: "G-ZEZBRRHKHJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            const authPanel = document.getElementById('auth-panel');
            const adminPanel = document.getElementById('admin-panel');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const addNewsForm = document.getElementById('add-news-form');
            const addEventForm = document.getElementById('add-event-form');
            const newsList = document.getElementById('news-list');
            const eventsList = document.getElementById('events-list');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    authPanel.style.display = 'none';
                    adminPanel.style.display = 'block';
                    loadNewsAdmin();
                    loadEventsAdmin();
                } else {
                    authPanel.style.display = 'block';
                    adminPanel.style.display = 'none';
                }
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    alert('Ошибка входа: ' + error.message);
                }
            });

            logoutBtn.addEventListener('click', () => {
                signOut(auth);
            });

            // Добавление новости
            addNewsForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('news-title').value;
                const text = document.getElementById('news-text').value;
                const tag = document.getElementById('news-tag').value;
                const image = document.getElementById('news-image').value;

                try {
                    await addDoc(collection(db, "news"), {
                        title: title.trim(),
                        text: text.trim(),
                        tag: tag ? tag.trim() : 'НОВОСТИ',
                        image: image ? image.trim() : '',
                        createdAt: serverTimestamp()
                    });
                    addNewsForm.reset();
                    alert('Новость успешно добавлена!');
                    loadNewsAdmin();
                } catch (error) {
                    alert('Ошибка при публикации новости: ' + error.message);
                }
            });

            // Добавление мероприятия
            addEventForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('event-title').value;
                const text = document.getElementById('event-text').value;
                const status = document.getElementById('event-status').value;
                const image = document.getElementById('event-image').value;

                try {
                    await addDoc(collection(db, "events"), {
                        title: title.trim(),
                        text: text.trim(),
                        status: status ? status.trim() : 'ПРЕДСТОЯЩЕЕ',
                        image: image ? image.trim() : '',
                        createdAt: serverTimestamp()
                    });
                    addEventForm.reset();
                    alert('Мероприятие успешно добавлено!');
                    loadEventsAdmin();
                } catch (error) {
                    alert('Ошибка при публикации мероприятия: ' + error.message);
                }
            });

            // Загрузка списка новостей для админки
            async function loadNewsAdmin() {
                newsList.innerHTML = '<p style="color: #888;">Загрузка...</p>';
                try {
                    const q = query(collection(db, "news"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    newsList.innerHTML = '';
                    if (querySnapshot.empty) {
                        newsList.innerHTML = '<p style="color: #888;">Нет добавленных новостей.</p>';
                        return;
                    }

                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        const item = document.createElement('div');
                        item.style.cssText = "background: #181818; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;";
                        item.innerHTML = `
                            <div>
                                <strong style="color: white; font-size: 15px;">${escapeHtml(data.title)}</strong>
                                <p style="color: #888; font-size: 13px; margin-top: 4px;">${escapeHtml(data.tag || 'НОВОСТИ')}</p>
                            </div>
                            <button class="edit-btn" style="background: var(--red); color: white;" onclick="deleteItem('news', '${document.id}')">Удалить</button>
                        `;
                        newsList.appendChild(item);
                    });
                } catch (e) {
                    console.error(e);
                    newsList.innerHTML = '<p style="color: var(--red);">Ошибка загрузки списка.</p>';
                }
            }

            // Загрузка списка мероприятий для админки
            async function loadEventsAdmin() {
                eventsList.innerHTML = '<p style="color: #888;">Загрузка...</p>';
                try {
                    const q = query(collection(db, "events"), orderBy("createdAt", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    eventsList.innerHTML = '';
                    if (querySnapshot.empty) {
                        eventsList.innerHTML = '<p style="color: #888;">Нет добавленных мероприятий.</p>';
                        return;
                    }

                    querySnapshot.forEach((document) => {
                        const data = document.data();
                        const item = document.createElement('div');
                        item.style.cssText = "background: #181818; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;";
                        item.innerHTML = `
                            <div>
                                <strong style="color: white; font-size: 15px;">${escapeHtml(data.title)}</strong>
                                <p style="color: #888; font-size: 13px; margin-top: 4px;">${escapeHtml(data.status || 'ПРЕДСТОЯЩЕЕ')}</p>
                            </div>
                            <button class="edit-btn" style="background: var(--red); color: white;" onclick="deleteItem('events', '${document.id}')">Удалить</button>
                        `;
                        eventsList.appendChild(item);
                    });
                } catch (e) {
                    console.error(e);
                    eventsList.innerHTML = '<p style="color: var(--red);">Ошибка загрузки списка.</p>';
                }
            }

            window.deleteItem = async function(colName, id) {
                if (confirm("Вы уверены, что хотите удалить этот элемент?")) {
                    try {
                        await deleteDoc(doc(db, colName, id));
                        alert("Успешно удалено!");
                        if (colName === 'news') loadNewsAdmin();
                        if (colName === 'events') loadEventsAdmin();
                    } catch (error) {
                        alert("Ошибка удаления: " + error.message);
                    }
                }
            };

            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        });
    </script>
</head>
<body style="background: var(--black); color: var(--white); padding: 40px 5%;">

    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--orange); padding-bottom: 15px;">
            <h1 style="color: var(--orange); font-size: 24px; text-transform: uppercase;">Панель Администратора</h1>
            <a href="index.html" class="btn btn-secondary" style="padding: 8px 16px; font-size: 13px;">← На сайт</a>
        </div>

        <!-- Окно авторизации -->
        <div id="auth-panel" class="contact-form-container" style="max-width: 450px; margin: 40px auto;">
            <h3>Вход в систему</h3>
            <form id="login-form" class="question-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email администратора" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Войти</button>
            </form>
        </div>

        <!-- Панель управления -->
        <div id="admin-panel" style="display: none;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 25px;">
                <button id="logout-btn" class="edit-btn" style="background: var(--red); color: white;">Выйти из аккаунта</button>
            </div>

            <!-- Добавление новости -->
            <div class="contact-form-container" style="margin-bottom: 35px;">
                <h3>Добавить новость</h3>
                <form id="add-news-form" class="question-form">
                    <div class="form-group"><input type="text" id="news-title" placeholder="Заголовок новости" required></div>
                    <div class="form-group"><input type="text" id="news-tag" placeholder="Тег (например: НОВОСТИ)"></div>
                    <div class="form-group"><input type="text" id="news-image" placeholder="Ссылка на изображение"></div>
                    <div class="form-group"><textarea id="news-text" rows="4" placeholder="Текст новости" required></textarea></div>
                    <button type="submit" class="btn btn-primary">Опубликовать новость</button>
                </form>
            </div>

            <!-- Список новостей -->
            <div class="contact-form-container" style="margin-bottom: 35px;">
                <h3>Управление новостями</h3>
                <div id="news-list"></div>
            </div>

            <!-- Добавление мероприятия -->
            <div class="contact-form-container" style="margin-bottom: 35px;">
                <h3>Добавить мероприятие</h3>
                <form id="add-event-form" class="question-form">
                    <div class="form-group"><input type="text" id="event-title" placeholder="Название мероприятия" required></div>
                    <div class="form-group"><input type="text" id="event-status" placeholder="Статус (например: ПРЕДСТОЯЩЕЕ)"></div>
                    <div class="form-group"><input type="text" id="event-image" placeholder="Ссылка на изображение"></div>
                    <div class="form-group"><textarea id="event-text" rows="4" placeholder="Описание мероприятия" required></textarea></div>
                    <button type="submit" class="btn btn-primary">Опубликовать мероприятие</button>
                </form>
            </div>

            <!-- Список мероприятий -->
            <div class="contact-form-container">
                <h3>Управление мероприятиями</h3>
                <div id="events-list"></div>
            </div>
        </div>
    </div>

</body>
</html>
