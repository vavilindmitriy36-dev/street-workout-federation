<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новость | Федерация Street Workout Казахстан</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<header class="header">
    <div class="container header-container" style="flex-direction: row; justify-content: space-between;">
        <div class="logo">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <strong>STREET WORKOUT</strong>
                <span>KAZAKHSTAN</span>
            </div>
        </div>
        <nav class="nav" style="margin-top:0;">
            <a href="index.html">Главная</a>
            <a href="index.html#news">Новости</a>
        </nav>
    </div>
</header>

<main class="container">
    <article class="single-news">
        <div id="news-tag" class="news-date">НОВОСТИ</div>
        <h1 id="news-title" style="font-size: 28px; margin-bottom: 20px;">Загрузка новости...</h1>
        <div id="news-image-container" style="margin-bottom: 20px;"></div>
        <div id="news-content-box" class="news-content">
            <p>Пожалуйста, подождите, идет загрузка информации...</p>
        </div>
        <a class="back-button" href="index.html#news">← Вернуться к новостям</a>
    </article>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 Street Workout Federation Kazakhstan. Все права защищены.</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
